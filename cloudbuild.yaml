steps:
  # Step 1: Run automated unit tests
  - name: 'node:20-alpine'
    entrypoint: 'npm'
    args: ['test']

  # Step 2: Build container image with Cloud Build
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/smart-warehouse-system:$COMMIT_SHA', '.']

  # Step 3: Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/smart-warehouse-system:$COMMIT_SHA']

  # Step 4: Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'smart-warehouse-system'
      - '--image=gcr.io/$PROJECT_ID/smart-warehouse-system:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'

images:
  - 'gcr.io/$PROJECT_ID/smart-warehouse-system:$COMMIT_SHA'
